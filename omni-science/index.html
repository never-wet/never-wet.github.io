<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni-Science | Project Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap');
        
        :root {
            --primary: #3b82f6;
            --bg: #020617;
        }

        body {
            background-color: var(--bg);
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .glass-portal {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 4rem;
            padding: 5rem 4rem;
            max-width: 700px;
            width: 90%;
            text-align: center;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.8);
            animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 10;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .action-button {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .action-button:hover {
            transform: scale(1.05) translateY(-4px);
            box-shadow: 0 20px 40px rgba(37, 99, 235, 0.4);
        }

        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="glass-portal">
        <div class="mb-10">
            <span class="px-4 py-1.5 bg-blue-500/10 border border-blue-500/20 rounded-full text-[10px] font-black uppercase tracking-[0.2em] text-blue-400">
                Production-Ready Platform
            </span>
        </div>

        <h1 class="text-6xl font-black tracking-tighter mb-8 bg-clip-text text-transparent bg-gradient-to-b from-white to-slate-500">
            OMNI<span class="text-blue-500">SCIENCE</span>
        </h1>

        <p class="text-slate-400 text-xl font-medium leading-relaxed mb-12 max-w-lg mx-auto">
            Welcome to the future of science education. This is a Next.js powered environment featuring real-time 3D physics simulations and structured learning paths.
        </p>

        <div class="flex flex-col items-center gap-6">
            <a href="http://localhost:3000" class="action-button inline-flex items-center justify-center px-12 py-5 rounded-3xl text-white font-black text-xl no-underline tracking-tight">
                Enter Research Lab
            </a>
            
            <div class="flex items-center gap-4 text-slate-600 font-bold uppercase text-[10px] tracking-widest">
                <span>React Three Fiber</span>
                <span class="w-1 h-1 bg-slate-800 rounded-full"></span>
                <span>Framer Motion</span>
                <span class="w-1 h-1 bg-slate-800 rounded-full"></span>
                <span>Next.js 14</span>
            </div>
        </div>

        <div class="absolute -bottom-12 left-1/2 -translate-x-1/2 text-slate-700 font-bold text-[9px] uppercase tracking-[0.4em] whitespace-nowrap">
            Interactive Intuition Engine // v1.0.4
        </div>
    </div>

</body>
</html>
